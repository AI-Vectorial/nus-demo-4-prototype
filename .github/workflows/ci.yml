name: pipeline

# Deliberately NOT both events on every branch. Running on push AND
# pull_request duplicates every check in the pull-request UI -- "backend
# (push)" beside "backend (pull_request)" -- which is noise a table has to read
# past to find the one check that actually gates the merge.
#
#   pull_request  ->  everything, on every branch with an open PR
#   push to main  ->  the deploy, after a merge
#   pull_request  ->  the checks, on every table's PR
#   push          ->  the deploy, after a merge into a table branch
#
# A push to work/table-N never deploys. Only a merge into table-N does, and
# that merge needs a human. If a push could deploy, the gate would be
# bypassable -- and the gate is the module.
#
# Work branches are work/table-N, NOT table-N/build: git cannot hold both
# refs/heads/table-3 and refs/heads/table-3/build, because the first is a file
# and the second would need it to be a directory.
#
# facilitator is a sixth table, run at the front of the room for everyone to
# follow: work/facilitator -> facilitator -> api-facilitator / web-facilitator.
# Same checks, same gate, same review, same deploy.
on:
  push:
    branches: [main, "table-[1-5]", facilitator, reference]
  pull_request:
    branches: [main, "table-[1-5]", facilitator, reference]

jobs:
  # ---------------------------------------------------------------------------
  # WHAT CHANGED. Runs first so we only build what the diff actually touched.
  #
  # During the lab a table commits ticket files to tickets/ several times. Each
  # of those triggering a full backend + frontend build would waste minutes in a
  # session where minutes are the scarce resource.
  # ---------------------------------------------------------------------------
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50 --quiet
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="HEAD~1"
          else
            git fetch origin main --depth=50 --quiet
            BASE="origin/main"
          fi

          FILES=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          echo "changed files:"; echo "$FILES" | sed 's/^/  /'

          # ci/ and the workflow affect both: the checks themselves changed
          echo "$FILES" | grep -qE '^(backend/|ci/|\.github/workflows/)'  && B=true || B=false
          echo "$FILES" | grep -qE '^(frontend/|ci/|\.github/workflows/)' && F=true || F=false

          echo "backend=$B"  >> "$GITHUB_OUTPUT"
          echo "frontend=$F" >> "$GITHUB_OUTPUT"
          echo; echo "backend job: $B    frontend job: $F"

  # ---------------------------------------------------------------------------
  # SCOPE. Always runs, on every change, including documentation.
  #
  # This is M04.3's permission boundary made mechanical, and it is the one check
  # that must never be skippable — a diff touching a protected path is exactly
  # as wrong when it is a markdown file as when it is code.
  # ---------------------------------------------------------------------------
  scope:
    name: scope check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ci/check_scope.py

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # acceptance criteria are executable                    [M04.2 / M04.4]
      - name: tests
        run: pytest -q

      # security review is not optional            [M04.4 five-pass, pass 2]
      - name: security scan
        run: bandit -r app/ -ll

      # provenance and licensing                   [M04.4 five-pass, pass 4]
      - name: licence check
        run: python ../ci/check_licences.py

      - name: lint
        run: ruff check app/ tests/

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # build first: it generates next-env.d.ts, which typecheck reads
      - name: build
        run: npm run build

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # AI REVIEW. A second, independent reviewer on every pull request.  [M04.4]
  #
  # The table reviewed its own work at stage 04, with its own agent. This one
  # has never seen that conversation. It checks every acceptance criterion in
  # tickets/T1.md against the code, runs the five passes over the diff, and
  # posts one comment on the pull request -- "Review passed, good for merge"
  # or "Changes requested", with what is left and how to do it.
  #
  # Watch it work: Actions -> this run -> "AI review". Every file it opens and
  # every search it runs is printed as it happens.
  #
  # ADVISORY. The gate does not need it, so a red review never blocks a merge.
  # A model can be wrong; the merge is a human's decision, and stays one.
  # Any OpenRouter model can do the job: change REVIEW_MODEL, nothing else.
  # ---------------------------------------------------------------------------
  review:
    name: AI review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # A second push while a review is running makes that review stale.
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: review
        run: python ci/review_agent.py
        env:
          REVIEW_API: ${{ secrets.REVIEW_API }}
          REVIEW_MODEL: anthropic/claude-haiku-5.5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # ---------------------------------------------------------------------------
  # GATE. The single required status check.
  #
  # Always runs, so a skipped job never leaves a pull request waiting on a check
  # that will never report. Passes when nothing that ran failed.
  # ---------------------------------------------------------------------------
  gate:
    name: gate
    needs: [scope, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        run: |
          echo "scope    ${{ needs.scope.result }}"
          echo "backend  ${{ needs.backend.result }}"
          echo "frontend ${{ needs.frontend.result }}"
          echo

          if [ "${{ needs.scope.result }}" != "success" ]; then
            echo "The scope check did not pass. Nothing merges."
            exit 1
          fi
          for result in "${{ needs.backend.result }}" "${{ needs.frontend.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job failed. Nothing merges."; exit 1 ;;
            esac
          done
          echo "Everything that needed to run has passed."

  # ---------------------------------------------------------------------------
  # DEPLOY. Reachable only through CI, and CI stops at a human.
  #
  # There is no path from a workspace to Railway. If a table could deploy from a
  # terminal the gate would be bypassable — and the gate is the lesson.
  # ---------------------------------------------------------------------------
  # Each table deploys to its own pair of services, decided by the branch that
  # was merged. Table 3's merge can only ever reach table 3's deployment.
  deploy:
    name: deploy
    needs: gate
    # always() is required: backend/frontend may legitimately be skipped, and a
    # skipped job propagates its skip to everything downstream unless the job
    # opts out. Without this, a docs-only merge to main would silently not deploy.
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/table-') ||
       github.ref == 'refs/heads/facilitator' ||
       github.ref == 'refs/heads/reference')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The branch decides which pair of services it reaches. Table 3's merge
      # can only ever touch table 3's deployment, the facilitator's only the
      # facilitator pair, and the reference branch only the reference pair.
      - name: which deployment is this
        id: table
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "reference" ]; then
            echo "n=ref"        >> "$GITHUB_OUTPUT"
            echo "api=api"      >> "$GITHUB_OUTPUT"
            echo "web=web"      >> "$GITHUB_OUTPUT"
            echo "deploying the reference build"
          elif [ "$BRANCH" = "facilitator" ]; then
            echo "n=facilitator"         >> "$GITHUB_OUTPUT"
            echo "api=api-facilitator"   >> "$GITHUB_OUTPUT"
            echo "web=web-facilitator"   >> "$GITHUB_OUTPUT"
            echo "deploying the facilitator's build"
          else
            N="${BRANCH#table-}"
            echo "n=$N"              >> "$GITHUB_OUTPUT"
            echo "api=api-table-$N"  >> "$GITHUB_OUTPUT"
            echo "web=web-table-$N"  >> "$GITHUB_OUTPUT"
            echo "deploying table $N"
          fi

      - name: install railway cli
        run: npm install -g @railway/cli

      # Each service uploads only its own directory, so the backend build never
      # sees node_modules and the frontend never sees the venv.
      - name: deploy backend
        working-directory: backend
        run: railway up --service "${{ steps.table.outputs.api }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: deploy frontend
        working-directory: frontend
        run: railway up --service "${{ steps.table.outputs.web }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ask Railway where THIS table's API lives. A single repository-wide
      # API_URL cannot be right for five tables, and a stale one is worse than
      # none -- it fails the release of a deployment that is perfectly healthy.
      - name: resolve this table's url
        id: url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          DOMAIN="$(railway variables --service "${{ steps.table.outputs.api }}" --json                     | python -c 'import json,sys;print(json.load(sys.stdin).get("RAILWAY_PUBLIC_DOMAIN",""))')"
          if [ -z "$DOMAIN" ]; then
            echo "::error::${{ steps.table.outputs.api }} has no public domain."
            echo "::error::Run: railway domain --service ${{ steps.table.outputs.api }}"
            exit 1
          fi
          echo "api=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "table ${{ steps.table.outputs.n }} api: https://$DOMAIN"

      # "It works on my machine" is not a release.                    [M04.5]
      #
      # railway up --detach returns as soon as the upload is accepted, but the
      # build and health check take a minute or two. The smoke test has to be
      # patient enough to outlast a cold build, or it fails a release that was
      # about to succeed -- which is worse than not checking at all.
      - name: smoke test
        run: python ci/smoke.py "${{ steps.url.outputs.api }}"
