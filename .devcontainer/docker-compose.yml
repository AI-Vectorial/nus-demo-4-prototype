# Postgres and Qdrant, in the Codespace.
#
# Without these a table can write ingestion but cannot run it -- the first
# time they would find out whether it works is after a deploy, at about two
# minutes a try. In a sixty-minute build that is the difference between
# iterating and guessing.
#
# Nothing here is shared with another table, so a --force re-index costs
# nobody else anything.

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/nus-demo-4-prototype:cached
    command: sleep infinity
    depends_on:
      - postgres
      - qdrant
    environment:
      # Local stores. The deployed service gets its own values from Railway.
      DATABASE_URL: postgresql://policy:policy@postgres:5432/policy
      DATABASE_NAME: policy
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: policy_passages
      API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policy
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
