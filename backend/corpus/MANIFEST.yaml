# ---------------------------------------------------------------------------
# Deliberate properties. Each exists so a specific behaviour is demonstrable.
# ---------------------------------------------------------------------------

known_conflict:
  summary: >-
    Records Retention requires client correspondence to be kept for seven years from
    the end of the relationship. Outsourcing requires a provider to destroy all copies
    within five years of termination. Both documents are current. Where a provider
    holds the only copy, the two cannot both be satisfied.
  documents:
    - id: records-retention
      section: "4.1 General table — client correspondence"
      requires: 7 years from end of relationship
    - id: outsourcing-third-party
      section: "6.4 Return and destruction on exit"
      requires: destruction within 5 years of termination
  resolution: >-
    Unresolved by design. Outsourcing section 6.4 carries a note telling the reader to
    escalate to Group Legal and Group Operational Risk jointly and NOT to resolve it
    locally. This is the real-world answer -- the conflict is a governance problem the
    bank already has, not one its software should decide.
  teaches: >-
    PRD decision D6. A team that resolves this in code has made their software decide
    which policy wins. Saying so is a better answer than a clever implementation.

superseded_version:
  summary: >-
    The travel expense approval threshold changed from GBP 50 to GBP 75 on 1 April 2026.
    Both versions are indexed. A question about "the approval threshold" is answerable
    two different ways depending on which version is retrieved.
  teaches: >-
    REQ-I7 and PRD decision D4. Superseded documents are indexed WITH their status, not
    excluded -- otherwise "is this still current?" becomes unanswerable.

exact_threshold:
  summary: >-
    Travel and Expense section 4.2 states that claims of GBP 75 OR MORE require
    line-manager approval, and says explicitly that a claim of exactly GBP 75 requires
    approval.
  teaches: >-
    The boundary. An implementation using > rather than >= passes every happy-path test
    and fails at exactly 75. This is where M04 Lab 17's planted defect lives.

deliberate_gap:
  summary: >-
    Nothing in this corpus covers expenses for a family member, partner or dependant
    accompanying an employee on business travel. The Travel and Expense Policy is silent.
  teaches: >-
    Refusal. "Can I expense my partner's flight?" must produce a refusal that points at
    Group Finance, not a plausible invention. This is the brief's section 12 example and
    the product's defining behaviour.
